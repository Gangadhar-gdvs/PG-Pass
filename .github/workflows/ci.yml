name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_FIREBASE_API_KEY: "demo-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "pgpass-demo.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "pgpass-demo"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"
          B2_ENDPOINT: "http://localhost:9000"
          B2_REGION: "eu-central-003"
          B2_S3_HOST: "localhost:9000"
          B2_BUCKET: "pgpass-photos"
          B2_KEY_ID: "minioadmin"
          B2_APP_KEY: "minioadmin"
          CRON_SECRET: "ci-cron-secret"
